<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Customer Management - HomeBites Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--orange:#FF6B35;--yellow:#FFC300;--red:#E63946;--green:#06D6A0;--dark:#0d0d1a;--card:#1a1a2e;--border:rgba(255,107,53,.18);--white:#fff}
    body{font-family:"Poppins",sans-serif;background:var(--dark);color:var(--white);display:flex;min-height:100vh}
    a{text-decoration:none;color:inherit}
    .sidebar{width:220px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
    .sb-brand{padding:22px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
    .sb-brand .ico{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--orange),var(--yellow));display:flex;align-items:center;justify-content:center;font-size:18px}
    .sb-brand span em{font-style:normal;color:var(--orange)}
    .sb-nav{flex:1;overflow-y:auto;padding:14px 12px}
    .sb-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.75);transition:all .2s;border:1px solid transparent;margin-bottom:4px}
    .sb-item:hover,.sb-item.active{background:rgba(255,107,53,.14);border-color:rgba(255,107,53,.3);color:var(--orange)}
    .sb-item i{width:18px;color:var(--orange);font-size:15px}
    .sb-section{font-size:10px;font-weight:700;color:rgba(255,255,255,.3);letter-spacing:1px;text-transform:uppercase;padding:14px 14px 6px}
    .sb-footer{padding:14px 12px;border-top:1px solid var(--border)}
    .sb-logout{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:rgba(230,57,70,.1);border:1px solid rgba(230,57,70,.25);color:#ff6b6b;font-size:13px;font-weight:600;cursor:pointer}
    .sb-logout:hover{background:rgba(230,57,70,.2)}
    .main{margin-left:220px;flex:1;display:flex;flex-direction:column}
    .topbar{background:rgba(26,26,46,.97);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
    .topbar h2{font-size:18px;font-weight:700}
    .admin-badge{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.7)}
    .admin-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
    .content{padding:28px;flex:1}
    .top-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:14px}
    .search-wrap{position:relative;width:300px}
    .search-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.4);font-size:13px}
    .search-box{width:100%;padding:10px 14px 10px 38px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:10px;color:#fff;font-family:inherit;font-size:13.5px;outline:none}
    .search-box:focus{border-color:var(--orange)}
    .table-card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden}
    table{width:100%;border-collapse:collapse}
    th{font-size:11px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.5px;padding:12px 18px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06)}
    td{padding:14px 18px;font-size:13.5px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:rgba(255,255,255,.02)}
    .badge-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
    .pill-green{background:rgba(6,214,160,.15);color:#06D6A0}
    .pill-red{background:rgba(230,57,70,.15);color:#ff6b6b}
    .pill-blue{background:rgba(59,130,246,.15);color:#93c5fd}
    .btn-action{padding:6px 14px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .18s}
    .btn-toggle-deact{background:rgba(230,57,70,.18);color:#ff6b6b;border:1px solid rgba(230,57,70,.3)}
    .btn-toggle-act{background:rgba(6,214,160,.18);color:#06D6A0;border:1px solid rgba(6,214,160,.3)}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(30,30,50,.97);border:1px solid rgba(255,107,53,.4);color:#fff;padding:11px 24px;border-radius:50px;font-size:13.5px;font-weight:600;z-index:99999;transition:transform .35s;white-space:nowrap}
    .toast.show{transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>
<nav class="sidebar">
  <div class="sb-brand"><div class="ico">&#9881;</div><span>Home<em>Bites</em></span></div>
  <div class="sb-nav">
    <div class="sb-section">Main</div>
    <a href="dashboard.html" class="sb-item"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <a href="orders.html"    class="sb-item"><i class="fa-solid fa-receipt"></i> Orders</a>
    <a href="users.html"     class="sb-item active"><i class="fa-solid fa-users"></i> Customers</a>
    <div class="sb-section">Catalogue</div>
    <a href="menu.html"    class="sb-item"><i class="fa-solid fa-utensils"></i> Menu Items</a>
    <a href="coupons.html" class="sb-item"><i class="fa-solid fa-tags"></i> Coupons</a>
  </div>
  <div class="sb-footer">
    <div class="sb-logout" onclick="adminLogout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</div>
  </div>
</nav>

<div class="main">
  <div class="topbar">
    <h2>👥 Registered Customers</h2>
    <div class="admin-badge"><div class="dot"></div><span id="adminName">Admin</span></div>
  </div>

  <div class="content">
    <div class="top-controls">
      <div style="font-size:14px;color:rgba(255,255,255,0.7);" id="totalUsersCount">Loading customers...</div>
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" class="search-box" id="userSearch" placeholder="Search by name, email, mobile..." oninput="handleSearch(this.value)">
      </div>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>User ID</th>
            <th>Customer Name</th>
            <th>Email</th>
            <th>Mobile</th>
            <th>Orders</th>
            <th>Status</th>
            <th>Joined</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersTbl">
          <tr><td colspan="8" style="text-align:center;padding:40px;color:rgba(255,255,255,0.4)">Loading customers...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const ADMIN_API = 'http://localhost:5000/api/admin';
  const admin = JSON.parse(sessionStorage.getItem('hb_admin') || 'null');
  if (!admin) window.location.href = 'login.html';
  else { const el = document.getElementById('adminName'); if(el) el.textContent = admin.name || 'Admin'; }

  function adminLogout() {
    sessionStorage.removeItem('hb_admin');
    window.location.href = '../index.html';
  }

  let allUsers = [];

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2600);
  }

  async function loadUsers() {
    try {
      const res = await fetch(ADMIN_API + '/users');
      const data = await res.json();
      if (data.success) {
        allUsers = data.data;
        document.getElementById('totalUsersCount').textContent = `Total registered customers: ${allUsers.length}`;
        renderUsers(allUsers);
      }
    } catch(err) {
      document.getElementById('usersTbl').innerHTML = '<tr><td colspan="8" style="text-align:center;color:#ff6b6b;padding:30px;">Error loading users from server.</td></tr>';
    }
  }

  function renderUsers(users) {
    const tbody = document.getElementById('usersTbl');
    if (!users || users.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:rgba(255,255,255,0.4)">No customers match your search.</td></tr>';
      return;
    }

    tbody.innerHTML = users.map(u => {
      const joinDate = u.createdAt ? new Date(u.createdAt).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }) : '—';
      const isActive = u.isActive;
      return `
        <tr>
          <td><strong style="color:var(--orange)">#${u.id}</strong></td>
          <td><strong>${u.fullName}</strong></td>
          <td>${u.email}</td>
          <td>${u.mobile}</td>
          <td><span class="badge-pill pill-blue">${u.orderCount} Orders</span></td>
          <td><span class="badge-pill ${isActive ? 'pill-green' : 'pill-red'}">${isActive ? 'Active' : 'Deactivated'}</span></td>
          <td style="font-size:12px;color:rgba(255,255,255,0.5);">${joinDate}</td>
          <td>
            <button class="btn-action ${isActive ? 'btn-toggle-deact' : 'btn-toggle-act'}" onclick="toggleUser(${u.id})">
              ${isActive ? 'Deactivate' : 'Activate'}
            </button>
          </td>
        </tr>
      `;
    }).join('');
  }

  function handleSearch(val) {
    const q = val.trim().toLowerCase();
    if (!q) {
      renderUsers(allUsers);
      return;
    }
    const filtered = allUsers.filter(u => 
      (u.fullName || '').toLowerCase().includes(q) ||
      (u.email || '').toLowerCase().includes(q) ||
      (u.mobile || '').includes(q)
    );
    renderUsers(filtered);
  }

  async function toggleUser(id) {
    try {
      const res = await fetch(`${ADMIN_API}/users/${id}/toggle`, { method: 'PUT' });
      const data = await res.json();
      if (data.success) {
        showToast(`User status updated to ${data.isActive ? 'Active' : 'Deactivated'}`);
        await loadUsers();
      } else {
        showToast('Failed to update user status.');
      }
    } catch(e) {
      showToast('Server error while updating user.');
    }
  }

  loadUsers();
</script>
</body>
</html>
