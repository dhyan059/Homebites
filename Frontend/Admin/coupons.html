<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Discount Coupons - HomeBites Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--orange:#FF6B35;--yellow:#FFC300;--red:#E63946;--green:#06D6A0;--dark:#0d0d1a;--card:#1a1a2e;--border:rgba(255,107,53,.18);--white:#fff}
    body{font-family:"Poppins",sans-serif;background:var(--dark);color:var(--white);display:flex;min-height:100vh}
    a{text-decoration:none;color:inherit}
    .sidebar{width:220px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
    .sb-brand{padding:22px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
    .sb-brand .ico{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--orange),var(--yellow));display:flex;align-items:center;justify-content:center;font-size:18px}
    .sb-brand span em{font-style:normal;color:var(--orange)}
    .sb-nav{flex:1;overflow-y:auto;padding:14px 12px}
    .sb-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.75);transition:all .2s;border:1px solid transparent;margin-bottom:4px}
    .sb-item:hover,.sb-item.active{background:rgba(255,107,53,.14);border-color:rgba(255,107,53,.3);color:var(--orange)}
    .sb-item i{width:18px;color:var(--orange);font-size:15px}
    .sb-section{font-size:10px;font-weight:700;color:rgba(255,255,255,.3);letter-spacing:1px;text-transform:uppercase;padding:14px 14px 6px}
    .sb-footer{padding:14px 12px;border-top:1px solid var(--border)}
    .sb-logout{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:rgba(230,57,70,.1);border:1px solid rgba(230,57,70,.25);color:#ff6b6b;font-size:13px;font-weight:600;cursor:pointer}
    .sb-logout:hover{background:rgba(230,57,70,.2)}
    .main{margin-left:220px;flex:1;display:flex;flex-direction:column}
    .topbar{background:rgba(26,26,46,.97);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
    .topbar h2{font-size:18px;font-weight:700}
    .admin-badge{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.7)}
    .admin-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
    .content{padding:28px;flex:1}
    .top-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .btn-create{padding:10px 22px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--orange),var(--yellow));color:var(--dark);font-weight:700;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:transform .2s;}
    .btn-create:hover{transform:translateY(-2px)}
    .table-card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden}
    table{width:100%;border-collapse:collapse}
    th{font-size:11px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.5px;padding:12px 18px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06)}
    td{padding:14px 18px;font-size:13.5px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:rgba(255,255,255,.02)}
    .badge-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
    .pill-green{background:rgba(6,214,160,.15);color:#06D6A0}
    .pill-red{background:rgba(230,57,70,.15);color:#ff6b6b}
    .coupon-code{font-family:monospace;font-size:14px;font-weight:800;letter-spacing:1px;background:rgba(255,107,53,.15);color:var(--orange);padding:4px 10px;border-radius:6px;border:1px dashed var(--orange)}
    .btn-action{padding:6px 12px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;margin:2px}
    .btn-del{background:rgba(230,57,70,.18);color:#ff6b6b;border:1px solid rgba(230,57,70,.3)}
    .btn-tog{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.15)}
    
    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}
    .modal-overlay.open{display:flex}
    .modal-card{background:#16213E;border:1px solid var(--orange);border-radius:20px;padding:28px;width:min(440px,100%);color:#fff}
    .modal-card h3{margin-bottom:18px;font-size:18px}
    .form-group{margin-bottom:14px}
    .form-group label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:rgba(255,255,255,.8)}
    .form-group input{width:100%;padding:10px 14px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);border-radius:10px;color:#fff;font-family:inherit;font-size:13.5px;outline:none}
    .modal-btns{display:flex;gap:10px;margin-top:20px}
    .modal-btn{flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(30,30,50,.97);border:1px solid rgba(255,107,53,.4);color:#fff;padding:11px 24px;border-radius:50px;font-size:13.5px;font-weight:600;z-index:99999;transition:transform .35s;white-space:nowrap}
    .toast.show{transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>
<nav class="sidebar">
  <div class="sb-brand"><div class="ico">&#9881;</div><span>Home<em>Bites</em></span></div>
  <div class="sb-nav">
    <div class="sb-section">Main</div>
    <a href="dashboard.html" class="sb-item"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <a href="orders.html"    class="sb-item"><i class="fa-solid fa-receipt"></i> Orders</a>
    <a href="users.html"     class="sb-item"><i class="fa-solid fa-users"></i> Customers</a>
    <div class="sb-section">Catalogue</div>
    <a href="menu.html"    class="sb-item"><i class="fa-solid fa-utensils"></i> Menu Items</a>
    <a href="coupons.html" class="sb-item active"><i class="fa-solid fa-tags"></i> Coupons</a>
  </div>
  <div class="sb-footer">
    <div class="sb-logout" onclick="adminLogout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</div>
  </div>
</nav>

<div class="main">
  <div class="topbar">
    <h2>🎟️ Coupon & Discount Management</h2>
    <div class="admin-badge"><div class="dot"></div><span id="adminName">Admin</span></div>
  </div>

  <div class="content">
    <div class="top-controls">
      <div style="font-size:14px;color:rgba(255,255,255,0.7);" id="couponCountLabel">Configured Coupons: 3</div>
      <button class="btn-create" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> Create New Coupon</button>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Coupon Code</th>
            <th>Discount</th>
            <th>Min Order Value</th>
            <th>Max Discount</th>
            <th>Expiry Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="couponsTbl"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ADD COUPON MODAL -->
<div class="modal-overlay" id="addCouponModal">
  <div class="modal-card">
    <h3>➕ Add New Coupon</h3>
    <div class="form-group">
      <label>Coupon Code (Uppercase)</label>
      <input type="text" id="cCode" placeholder="e.g. FESTIVE30" style="text-transform:uppercase;">
    </div>
    <div class="form-group">
      <label>Discount Percentage (%)</label>
      <input type="number" id="cDiscount" placeholder="e.g. 20" min="1" max="100">
    </div>
    <div class="form-group">
      <label>Minimum Order (₹)</label>
      <input type="number" id="cMinOrder" placeholder="e.g. 200" min="0">
    </div>
    <div class="form-group">
      <label>Maximum Discount (₹)</label>
      <input type="number" id="cMaxDiscount" placeholder="e.g. 100" min="1">
    </div>
    <div class="form-group">
      <label>Valid Till</label>
      <input type="date" id="cExpiry">
    </div>
    <div class="modal-btns">
      <button class="modal-btn" onclick="saveCoupon()" style="background:var(--orange);color:#fff">Save Coupon</button>
      <button class="modal-btn" onclick="closeAddModal()" style="background:rgba(255,255,255,.08);color:#fff">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const admin = JSON.parse(sessionStorage.getItem('hb_admin') || 'null');
  if (!admin) window.location.href = 'login.html';
  else { const el = document.getElementById('adminName'); if(el) el.textContent = admin.name || 'Admin'; }

  function adminLogout() {
    sessionStorage.removeItem('hb_admin');
    window.location.href = '../index.html';
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2600);
  }

  const DEFAULT_COUPONS = [
    { id: 1, code: 'WELCOME50', discountPct: 50, minOrder: 150, maxDiscount: 100, expiry: '2026-12-31', active: true },
    { id: 2, code: 'HOMEBITES',  discountPct: 20, minOrder: 250, maxDiscount: 75,  expiry: '2026-12-31', active: true },
    { id: 3, code: 'FEAST100',   discountPct: 30, minOrder: 400, maxDiscount: 150, expiry: '2026-12-31', active: true }
  ];

  function getCoupons() {
    try {
      const stored = localStorage.getItem('homebites_coupons');
      if (stored) return JSON.parse(stored);
    } catch(e) {}
    localStorage.setItem('homebites_coupons', JSON.stringify(DEFAULT_COUPONS));
    return DEFAULT_COUPONS;
  }

  function renderCoupons() {
    const coupons = getCoupons();
    document.getElementById('couponCountLabel').textContent = `Configured Coupons: ${coupons.length}`;
    const tbody = document.getElementById('couponsTbl');
    if (!coupons.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:rgba(255,255,255,0.4)">No coupons found. Create your first coupon!</td></tr>';
      return;
    }

    tbody.innerHTML = coupons.map(c => `
      <tr>
        <td><span class="coupon-code">${c.code}</span></td>
        <td><strong>${c.discountPct}% OFF</strong></td>
        <td>₹${c.minOrder}</td>
        <td>₹${c.maxDiscount}</td>
        <td style="font-size:12px;color:rgba(255,255,255,0.6);">${c.expiry}</td>
        <td><span class="badge-pill ${c.active ? 'pill-green' : 'pill-red'}">${c.active ? 'Active' : 'Disabled'}</span></td>
        <td>
          <button class="btn-action btn-tog" onclick="toggleCoupon(${c.id})">${c.active ? 'Disable' : 'Enable'}</button>
          <button class="btn-action btn-del" onclick="deleteCoupon(${c.id})">Delete</button>
        </td>
      </tr>
    `).join('');
  }

  function toggleCoupon(id) {
    const coupons = getCoupons();
    const c = coupons.find(x => x.id === id);
    if (c) {
      c.active = !c.active;
      localStorage.setItem('homebites_coupons', JSON.stringify(coupons));
      showToast(`Coupon ${c.code} is now ${c.active ? 'Active' : 'Disabled'}`);
      renderCoupons();
    }
  }

  function deleteCoupon(id) {
    if (!confirm('Are you sure you want to delete this coupon?')) return;
    let coupons = getCoupons();
    coupons = coupons.filter(x => x.id !== id);
    localStorage.setItem('homebites_coupons', JSON.stringify(coupons));
    showToast('Coupon removed successfully.');
    renderCoupons();
  }

  function openAddModal() {
    document.getElementById('cCode').value = '';
    document.getElementById('cDiscount').value = '';
    document.getElementById('cMinOrder').value = '';
    document.getElementById('cMaxDiscount').value = '';
    document.getElementById('cExpiry').value = '2026-12-31';
    document.getElementById('addCouponModal').classList.add('open');
  }

  function closeAddModal() {
    document.getElementById('addCouponModal').classList.remove('open');
  }

  function saveCoupon() {
    const code = document.getElementById('cCode').value.trim().toUpperCase();
    const discount = parseInt(document.getElementById('cDiscount').value, 10);
    const minOrder = parseInt(document.getElementById('cMinOrder').value, 10) || 0;
    const maxDiscount = parseInt(document.getElementById('cMaxDiscount').value, 10) || 50;
    const expiry = document.getElementById('cExpiry').value || '2026-12-31';

    if (!code || isNaN(discount) || discount <= 0 || discount > 100) {
      alert('Please enter a valid coupon code and discount percentage (1-100).');
      return;
    }

    const coupons = getCoupons();
    if (coupons.some(c => c.code === code)) {
      alert('A coupon with this code already exists.');
      return;
    }

    coupons.push({
      id: Date.now(),
      code,
      discountPct: discount,
      minOrder,
      maxDiscount,
      expiry,
      active: true
    });

    localStorage.setItem('homebites_coupons', JSON.stringify(coupons));
    closeAddModal();
    showToast(`Coupon ${code} created successfully!`);
    renderCoupons();
  }

  renderCoupons();
</script>
</body>
</html>
