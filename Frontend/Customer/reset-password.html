<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Update Password - HomeBites</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
	<style>
		* { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: radial-gradient(circle at top right, #16213E, #1A1A2E 65%); color: #fff; font-family: 'Poppins', sans-serif; }
		.card { width: min(440px, 100%); padding: 36px 30px; border: 1px solid rgba(255,107,53,.25); border-radius: 20px; background: rgba(255,255,255,.06); box-shadow: 0 25px 70px rgba(0,0,0,.35); } .brand { text-align: center; margin-bottom: 24px; } .icon { width: 54px; height: 54px; margin: 0 auto 12px; display: grid; place-items: center; border-radius: 14px; background: linear-gradient(135deg,#FF6B35,#FFC300); color: #1A1A2E; font-size: 23px; } h1 { margin: 0 0 6px; font-size: 23px; } .brand p { margin: 0; color: rgba(255,255,255,.6); font-size: 13px; }
		.group { margin-bottom: 16px; } label { display: block; margin-bottom: 7px; color: rgba(255,255,255,.85); font-size: 13px; font-weight: 600; } .input { width: 100%; padding: 13px 15px; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; outline: none; background: rgba(255,255,255,.07); color: #fff; font: 14px 'Poppins', sans-serif; } .input:focus { border-color: #FF6B35; } .hint { margin: -5px 0 18px; color: rgba(255,255,255,.48); font-size: 11px; }
		.button { width: 100%; margin-top: 8px; padding: 13px; border: 0; border-radius: 10px; background: linear-gradient(135deg,#FF6B35,#FFC300); color: #1A1A2E; cursor: pointer; font: 700 14px 'Poppins', sans-serif; } .footer { margin-top: 22px; text-align: center; font-size: 13px; } a { color: #FF6B35; font-weight: 600; text-decoration: none; }
	</style>
</head>
<body>
	<main class="card">
		<div class="brand"><div class="icon"><i class="fa-solid fa-lock"></i></div><h1>Update Password</h1><p>Enter the OTP and choose a new password.</p></div>
		<form onsubmit="resetPassword(event)">
			<div class="group"><label for="otpCode">Reset OTP</label><input class="input" id="otpCode" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required placeholder="Enter 6-digit OTP" /></div>
			<div class="group"><label for="newPassword">New password</label><input class="input" id="newPassword" type="password" minlength="8" required placeholder="At least 8 characters" autocomplete="new-password" /></div>
			<div class="group"><label for="confirmPassword">Confirm new password</label><input class="input" id="confirmPassword" type="password" minlength="8" required placeholder="Repeat your password" autocomplete="new-password" /></div>
			<p class="hint">Your password must contain at least 8 characters.</p>
			<button class="button" id="submitButton" type="submit"><i class="fa-solid fa-check"></i> Update Password</button>
		</form>
		<div class="footer"><a href="login.html">Return to login</a></div>
	</main>
	<script src="../Scripts/auth.js"></script>
	<script>
		const params = new URLSearchParams(window.location.search);
		const identifier = localStorage.getItem('homebites_reset_identifier') || params.get('identifier') || '';
		document.getElementById('otpCode').focus();

		async function resetPassword(event) {
			event.preventDefault();
			const button = document.getElementById('submitButton');
			const otpCode = document.getElementById('otpCode').value.trim();
			const newPassword = document.getElementById('newPassword').value;
			const confirmPassword = document.getElementById('confirmPassword').value;
			if (newPassword !== confirmPassword) { Homebites.showToast('Passwords do not match.', true); return; }
			button.disabled = true;
			button.textContent = 'Updating...';
			try {
				const response = await fetch(`${API_BASE}/auth/reset-password`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ identifier, otpCode, newPassword }) });
				const responseText = await response.text();
				let data;
				try {
					data = JSON.parse(responseText);
				} catch {
					throw new Error(response.ok ? 'The server returned an invalid response. Please restart the backend.' : `Server error (${response.status}). Please restart the backend and try again.`);
				}
				if (!response.ok || !data.success) throw new Error(data.message || 'Unable to update password.');
				localStorage.removeItem('homebites_reset_identifier');
				Homebites.showToast('Password updated. Redirecting to login...');
				setTimeout(() => { window.location.href = 'login.html'; }, 900);
			} catch (error) {
				Homebites.showToast(error.message, true);
				button.disabled = false;
				button.innerHTML = '<i class="fa-solid fa-check"></i> Update Password';
			}
		}
	</script>
</body>
</html>
