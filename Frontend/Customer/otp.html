<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify OTP – HomeBites Hyderabad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange: #FF6B35; --orange2: #FF8C42; --yellow: #FFC300;
      --red: #E63946; --green: #06D6A0; --dark: #1A1A2E; --dark2: #16213E;
      --white: #FFFFFF;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top right, #16213E 0%, #1A1A2E 100%);
      color: var(--white); min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 30px 16px;
    }
    .auth-card {
      width: min(440px, 100%);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,107,53,0.25);
      backdrop-filter: blur(20px);
      border-radius: 24px; padding: 40px 32px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5); text-align: center;
    }
    .brand-logo {
      width: 54px; height: 54px; border-radius: 14px; margin: 0 auto 12px;
      background: linear-gradient(135deg, var(--orange), var(--yellow));
      display: flex; align-items: center; justify-content: center; font-size: 26px;
      box-shadow: 0 6px 20px rgba(255,107,53,0.4);
    }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    p { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 24px; line-height: 1.6; }
    
    

    .otp-inputs {
      display: flex; justify-content: center; gap: 10px; margin-bottom: 24px;
    }
    .otp-box {
      width: 46px; height: 54px; text-align: center; font-size: 20px; font-weight: 800;
      background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 12px; color: var(--white); outline: none; transition: border-color 0.2s;
    }
    .otp-box:focus { border-color: var(--orange); background: rgba(255,107,53,0.08); }

    .btn-submit {
      width: 100%; padding: 14px; border-radius: 12px; border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--orange), var(--yellow));
      color: var(--dark); font-size: 15px; font-weight: 800;
      box-shadow: 0 6px 20px rgba(255,107,53,0.4); transition: transform 0.2s;
    }
    .btn-submit:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="brand-logo">📲</div>
    <h1>Enter Verification OTP</h1>
    <p>Please enter the 6-digit verification code sent to your registered account.</p>

    <div id="otpInfoBox" style="background:rgba(6,214,160,0.1);border:1.5px solid rgba(6,214,160,0.4);border-radius:14px;padding:16px 14px;margin-bottom:22px;text-align:center;">
      <div style="font-size:12px;color:rgba(255,255,255,0.55);margin-bottom:8px;font-weight:500;">&#x1F4E8; A verification OTP has been sent to your registered email/mobile</div>
      <div style="font-size:11.5px;color:rgba(255,255,255,0.45);margin-top:4px;">&#x2714; Enter the 6-digit code in the boxes below</div>
    </div>

    <form onsubmit="handleVerifyOtp(event)">
      <div class="otp-inputs">
        <input type="text" class="otp-box" maxlength="1" oninput="moveNext(this, 1)" id="d1" autocomplete="off" required />
        <input type="text" class="otp-box" maxlength="1" oninput="moveNext(this, 2)" id="d2" autocomplete="off" required />
        <input type="text" class="otp-box" maxlength="1" oninput="moveNext(this, 3)" id="d3" autocomplete="off" required />
        <input type="text" class="otp-box" maxlength="1" oninput="moveNext(this, 4)" id="d4" autocomplete="off" required />
        <input type="text" class="otp-box" maxlength="1" oninput="moveNext(this, 5)" id="d5" autocomplete="off" required />
        <input type="text" class="otp-box" maxlength="1" oninput="moveNext(this, 6)" id="d6" autocomplete="off" required />
      </div>

      <button type="submit" class="btn-submit" id="btnVerify">
        <i class="fa-solid fa-check"></i> Verify & Proceed
      </button>
    </form>
  </div>

  <script src="../Scripts/page-runtime.js"></script>
  <script src="../Scripts/auth.js"></script>
  <script src="../Scripts/otp.js"></script>
  <script>
    const pendingOtp = localStorage.getItem('homebites_pending_otp');
    if (pendingOtp) console.log(`[OTP] Registration OTP: ${pendingOtp}`);

    document.getElementById('d1').focus();

    function moveNext(input, idx) {
      if (input.value.length === 1 && idx < 6) {
        document.getElementById(`d${idx + 1}`).focus();
      }
    }

    async function handleVerifyOtp(e) {
      e.preventDefault();
      const btn = document.getElementById('btnVerify');
      const otpCode = [1,2,3,4,5,6].map(i => document.getElementById(`d${i}`).value).join('');

      if (!HomebitesOtp.isValid(otpCode)) {
        Homebites.showToast('Please enter all 6 digits of the OTP.', true);
        return;
      }

      const email = localStorage.getItem('homebites_pending_email') || '';
      const mobile = localStorage.getItem('homebites_pending_mobile') || '';

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';

      let verifiedSuccessfully = false;

      try {
        const response = await fetch(`${API_BASE}/auth/verify-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email,
            mobile,
            otpCode,
            purpose: 'Registration'
          })
        });

        const data = await response.json();
        if (response.ok && data.success) {
          verifiedSuccessfully = true;
          const pendingUser = localStorage.getItem('homebites_pending_user');
          if (pendingUser) {
            Homebites.setUser(JSON.parse(pendingUser));
            localStorage.removeItem('homebites_pending_user');
          }
          localStorage.removeItem('homebites_pending_email');
          localStorage.removeItem('homebites_pending_mobile');
          localStorage.removeItem('homebites_pending_otp');
          Homebites.showToast('✅ Verification complete! Redirecting to menu in a moment...');
          btn.innerHTML = '<i class="fa-solid fa-check"></i> Verified! Redirecting...';
          setTimeout(() => {
            window.location.href = 'menu.html';
          }, 2500);
        } else {
          Homebites.showToast(data.message || 'Incorrect OTP. Please re-enter the code shown above.', true);
        }
      } catch (err) {
        Homebites.showToast('Could not connect to server.', true);
      } finally {
        if (!verifiedSuccessfully) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-check"></i> Verify & Proceed';
        }
      }
    }
  </script>
</body>
</html>
