<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart - HomeBites Hyderabad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--orange:#FF6B35;--yellow:#FFC300;--red:#E63946;--green:#06D6A0;--dark:#1A1A2E;--dark2:#16213E;--white:#FFFFFF}
    body{font-family:"Poppins",sans-serif;background:var(--dark);color:var(--white);padding-bottom:60px}
    a{text-decoration:none;color:inherit}
    .header{background:rgba(26,26,46,.95);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,107,53,.2);padding:16px 5%;display:flex;align-items:center;justify-content:space-between}
    .container{max-width:900px;margin:30px auto;padding:0 16px}
    .cart-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:24px;margin-bottom:24px}
    .cart-item{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.06);gap:12px}
    .cart-item:last-child{border-bottom:none}
    .item-left{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
    .item-img{width:62px;height:62px;border-radius:12px;overflow:hidden;flex-shrink:0;background:#16213E;border:1px solid rgba(255,255,255,.08)}
    .item-img img{width:100%;height:100%;object-fit:cover}
    .item-info{min-width:0}
    .item-info h4{font-size:15px;margin-bottom:3px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item-info span{font-size:13px;color:var(--orange);font-weight:700}
    .item-total{font-size:14px;color:rgba(255,255,255,.7);white-space:nowrap}
    .qty-controls{display:flex;align-items:center;gap:10px}
    .qty-btn{width:30px;height:30px;border-radius:8px;border:none;background:rgba(255,255,255,.1);color:var(--white);cursor:pointer;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;transition:background .2s}
    .qty-btn:hover{background:var(--orange)}
    .summary-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,107,53,.25);border-radius:20px;padding:24px}
    .summary-row{display:flex;justify-content:space-between;margin-bottom:10px;font-size:14px;color:rgba(255,255,255,.75)}
    .summary-row.total{font-size:18px;font-weight:800;color:var(--white);border-top:1px solid rgba(255,255,255,.1);padding-top:12px;margin-top:12px}
    .summary-row.total span:last-child{color:var(--orange)}
    .btn-checkout{width:100%;padding:15px;border-radius:12px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--orange),var(--yellow));color:var(--dark);font-weight:800;font-size:15px;margin-top:18px;transition:transform .2s;font-family:inherit}
    .btn-checkout:hover{transform:translateY(-2px)}
    .empty-cart{text-align:center;padding:60px 20px;color:rgba(255,255,255,.6)}
    .page-title{font-size:22px;font-weight:800;margin-bottom:20px;display:flex;align-items:center;gap:10px}
  </style>
</head>
<body>
  <header class="header">
    <a href="../index.html" style="font-weight:800;font-size:20px;">&#127869;&#65039; Home<em style="color:var(--orange);font-style:normal;">Bites</em></a>
    <div style="display:flex;align-items:center;gap:14px;">
      <a href="menu.html" style="color:var(--orange);font-size:13.5px;font-weight:600;"><i class="fa-solid fa-utensils"></i> Menu</a>
      <a href="my-orders.html" style="color:rgba(255,255,255,.75);font-size:13.5px;font-weight:600;">My Orders</a>
    </div>
  </header>

  <div class="container">
    <h2 class="page-title"><i class="fa-solid fa-cart-shopping" style="color:var(--orange);"></i> Your Order Cart</h2>
    <div id="cartContent"></div>
  </div>

  <script src="../Scripts/page-runtime.js"></script>
  <script src="../Scripts/auth.js"></script>
  <script src="../Scripts/cart.js"></script>
  <script>
    var FALLBACK = "https://images.unsplash.com/photo-1546833999-b9f581a1996d?auto=format&fit=crop&w=120&q=80";

    function renderCart() {
      var cart = Homebites.getCart();
      var container = document.getElementById("cartContent");

      if (!cart || cart.length === 0) {
        container.innerHTML = "<div class=\"cart-box empty-cart\"><div style=\"font-size:50px;margin-bottom:12px;\">&#127869;&#65039;</div><h3>Your cart is empty</h3><p style=\"margin-top:6px;font-size:13px;\">Add some delicious home-cooked meals from our Hyderabad kitchen.</p><a href=\"menu.html\" style=\"display:inline-block;margin-top:18px;padding:10px 24px;border-radius:50px;background:var(--orange);color:#fff;font-weight:700;font-size:14px;\">Browse Menu</a></div>";
        return;
      }

      var subtotal = 0;
      var itemsHtml = cart.map(function(item) {
        var lineTotal = item.discountPrice * item.quantity;
        subtotal += lineTotal;
        var imgSrc = item.imageUrl || FALLBACK;
        return "<div class=\"cart-item\">" +
          "<div class=\"item-left\">" +
            "<div class=\"item-img\"><img src=\"" + imgSrc + "\" alt=\"" + item.mealName + "\" loading=\"lazy\" onerror=\"this.onerror=null;this.src='" + FALLBACK + "'\" /></div>" +
            "<div class=\"item-info\">" +
              "<h4>" + item.mealName + "</h4>" +
              "<span>&#8377;" + item.discountPrice + " each</span>" +
            "</div>" +
          "</div>" +
          "<div style=\"display:flex;align-items:center;gap:18px;\">" +
            "<div class=\"qty-controls\">" +
              "<button class=\"qty-btn\" onclick=\"updateQuantity(" + item.mealId + ", -1)\">-</button>" +
              "<span style=\"font-weight:700;min-width:22px;text-align:center;\">" + item.quantity + "</span>" +
              "<button class=\"qty-btn\" onclick=\"updateQuantity(" + item.mealId + ", 1)\">+</button>" +
            "</div>" +
            "<div class=\"item-total\">&#8377;" + lineTotal + "</div>" +
          "</div>" +
        "</div>";
      }).join("");

      var totals = HomebitesCart.totals(cart);
      var delivery = totals.delivery;
      var tax = totals.tax;
      var total = totals.total;

      container.innerHTML =
        "<div class=\"cart-box\">" + itemsHtml + "</div>" +
        "<div class=\"summary-card\">" +
          "<div class=\"summary-row\"><span>Item Subtotal</span><span>&#8377;" + subtotal + "</span></div>" +
          "<div class=\"summary-row\"><span>Delivery (12 km Hyderabad)</span><span>" + (delivery === 0 ? "<strong style=\"color:#06D6A0;\">FREE</strong>" : "&#8377;" + delivery) + "</span></div>" +
          "<div class=\"summary-row\"><span>GST (5%)</span><span>&#8377;" + tax + "</span></div>" +
          "<div class=\"summary-row total\"><span>Grand Total</span><span>&#8377;" + total + "</span></div>" +
          "<button class=\"btn-checkout\" onclick=\"proceedToCheckout()\">Proceed to Checkout &rarr;</button>" +
        "</div>";
    }

    function updateQuantity(mealId, delta) {
      var cart = Homebites.getCart();
      var item = cart.find(function(i){ return i.mealId === mealId; });
      if (item) {
        item.quantity += delta;
        if (item.quantity <= 0) cart = cart.filter(function(i){ return i.mealId !== mealId; });
      }
      Homebites.saveCart(cart);
      renderCart();
    }

    function proceedToCheckout() {
      var user = Homebites.getUser();
      if (!user) {
        Homebites.showToast("Please login or register first before checking out.", true);
        setTimeout(function(){ window.location.href = "login.html"; }, 1200);
        return;
      }
      window.location.href = "address.html";
    }

    renderCart();
  </script>
</body>
</html>
