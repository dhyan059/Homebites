<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – HomeBites Hyderabad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange: #FF6B35; --orange2: #FF8C42; --yellow: #FFC300;
      --red: #E63946; --green: #06D6A0; --dark: #1A1A2E; --dark2: #16213E;
      --white: #FFFFFF;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top right, #16213E 0%, #1A1A2E 100%);
      color: var(--white); min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 30px 16px;
    }
    .auth-card {
      width: min(440px, 100%);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,107,53,0.25);
      backdrop-filter: blur(20px);
      border-radius: 24px; padding: 40px 32px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }
    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-logo {
      width: 54px; height: 54px; border-radius: 14px; margin: 0 auto 10px;
      background: linear-gradient(135deg, var(--orange), var(--yellow));
      display: flex; align-items: center; justify-content: center; font-size: 26px;
      box-shadow: 0 6px 20px rgba(255,107,53,0.4);
    }
    .brand-header h1 { font-size: 22px; font-weight: 800; }
    .brand-header p { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 4px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: rgba(255,255,255,0.85); }
    .input-box { position: relative; }
    .input-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4); font-size: 14px; }
    .input-box input {
      width: 100%; padding: 12px 16px 12px 42px;
      background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 12px; color: var(--white); font-size: 14px; font-family: inherit;
      outline: none; transition: all 0.25s;
    }
    .input-box input:focus { border-color: var(--orange); background: rgba(255,107,53,0.06); }
    .btn-submit {
      width: 100%; padding: 14px; border-radius: 12px; border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--orange), var(--yellow));
      color: var(--dark); font-size: 15px; font-weight: 800;
      box-shadow: 0 6px 20px rgba(255,107,53,0.4); transition: transform 0.2s;
      margin-top: 10px; font-family: inherit;
    }
    .btn-submit:hover { transform: translateY(-2px); }
    .otp-display-box {
      background: rgba(6,214,160,0.1); border: 1.5px solid rgba(6,214,160,0.35);
      border-radius: 14px; padding: 14px; text-align: center; margin-bottom: 20px;
    }
    .otp-code {
      font-size: 32px; font-weight: 900; letter-spacing: 8px; color: var(--yellow);
      font-family: monospace; background: rgba(0,0,0,0.3); padding: 8px 16px; border-radius: 10px;
      display: inline-block; margin-top: 6px;
    }
    .step-section { display: none; }
    .step-section.active { display: block; }
    .auth-footer { text-align: center; margin-top: 22px; font-size: 13px; color: rgba(255,255,255,0.6); }
    .auth-footer a { color: var(--orange); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="brand-header">
      <div class="brand-logo">🔑</div>
      <h1 id="pageTitle">Reset Your Password</h1>
      <p id="pageSubtitle">Enter your registered email or mobile to get an OTP</p>
    </div>

    <!-- STEP 1: Enter Email or Mobile -->
    <div id="step1" class="step-section active">
      <form onsubmit="handleSendOtp(event)">
        <div class="form-group">
          <label>Registered Gmail or Mobile</label>
          <div class="input-box">
            <i class="fa-solid fa-envelope"></i>
            <input type="text" id="resetIdentifier" placeholder="e.g. user@gmail.com or +919876543210" required />
          </div>
        </div>
        <button type="submit" class="btn-submit" id="btnSendOtp">
          Send Verification OTP →
        </button>
      </form>
    </div>

    <!-- STEP 2: Enter OTP -->
    <div id="step2" class="step-section">
      <div class="otp-display-box">
        <div style="font-size:12px;color:rgba(255,255,255,0.6);">Verification OTP sent</div>
      </div>

      <form onsubmit="handleVerifyOtp(event)">
        <div class="form-group">
          <label>6-Digit OTP</label>
          <div class="input-box">
            <i class="fa-solid fa-key"></i>
            <input type="text" id="resetOtpInput" placeholder="Enter 6-digit OTP" maxlength="6" required style="text-align:center;letter-spacing:4px;font-weight:700;" />
          </div>
        </div>
        <button type="submit" class="btn-submit" id="btnVerifyOtp">
          Verify OTP & Continue →
        </button>
      </form>
    </div>

    <!-- STEP 3: Set New Password -->
    <div id="step3" class="step-section">
      <form onsubmit="handleResetPassword(event)">
        <div class="form-group">
          <label>New Password (min. 8 characters)</label>
          <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="newPassword" placeholder="Enter new password" minlength="8" required />
          </div>
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="confirmPassword" placeholder="Re-enter new password" minlength="8" required />
          </div>
        </div>
        <button type="submit" class="btn-submit" id="btnResetPass">
          Update & Save Password
        </button>
      </form>
    </div>

    <div class="auth-footer">
      Remembered your password? <a href="login.html">Back to Login</a>
    </div>
  </div>

  <script src="../Scripts/auth.js"></script>
  <script>
    let currentIdentifier = '';
    let validatedOtp = '';

    function showStep(stepNum) {
      document.querySelectorAll('.step-section').forEach(s => s.classList.remove('active'));
      document.getElementById(`step${stepNum}`).classList.add('active');

      if (stepNum === 1) {
        document.getElementById('pageTitle').textContent = 'Reset Your Password';
        document.getElementById('pageSubtitle').textContent = 'Enter your registered email or mobile to get an OTP';
      } else if (stepNum === 2) {
        document.getElementById('pageTitle').textContent = 'Verify Security OTP';
        document.getElementById('pageSubtitle').textContent = 'Enter the 6-digit code to verify your identity';
      } else if (stepNum === 3) {
        document.getElementById('pageTitle').textContent = 'Set New Password';
        document.getElementById('pageSubtitle').textContent = 'Choose a strong password with at least 8 characters';
      }
    }

    async function handleSendOtp(e) {
      e.preventDefault();
      const identifier = document.getElementById('resetIdentifier').value.trim();
      const btn = document.getElementById('btnSendOtp');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating OTP...';

      try {
        const response = await fetch(`${API_BASE}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier })
        });

        const data = await response.json();
        if (response.ok && data.success) {
          console.log(`[OTP] Password reset OTP: ${data.otp}`);
          currentIdentifier = identifier;
          Homebites.showToast('OTP sent successfully!');
          showStep(2);
        } else {
          Homebites.showToast(data.message || 'Account not found.', true);
        }
      } catch (err) {
        Homebites.showToast('Could not connect to server.', true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Send Verification OTP →';
      }
    }

    async function handleVerifyOtp(e) {
      e.preventDefault();
      const otp = document.getElementById('resetOtpInput').value.trim();
      if (otp.length !== 6) {
        Homebites.showToast('Please enter a 6-digit OTP.', true);
        return;
      }
      validatedOtp = otp;
      Homebites.showToast('OTP verified! Now enter your new password.');
      showStep(3);
    }

    async function handleResetPassword(e) {
      e.preventDefault();
      const p1 = document.getElementById('newPassword').value;
      const p2 = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('btnResetPass');

      if (p1 !== p2) {
        Homebites.showToast('Passwords do not match!', true);
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Updating password...';

      try {
        const response = await fetch(`${API_BASE}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            identifier: currentIdentifier,
            otpCode: validatedOtp,
            newPassword: p1
          })
        });

        const data = await response.json();
        if (response.ok && data.success) {
          Homebites.showToast('🎉 Password reset successfully! Redirecting to login...');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1200);
        } else {
          Homebites.showToast(data.message || 'Failed to reset password.', true);
        }
      } catch (err) {
        Homebites.showToast('Server error while resetting password.', true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Update & Save Password';
      }
    }
  </script>
</body>
</html>
